unbind r
bind r source-file ~/.tmux.conf

set -g default-terminal "screen-256color"
set -as terminal-features ",xterm-256color:RGB"

# Rebind Leader
set -g prefix C-s

# Use -r to allow repetition of the key without re-pressing the prefix
bind -r n next-window
bind -r p previous-window

# Mouse Support
set -g mouse on

# Clipboard - allow OSC 52 passthrough for TUI apps (OpenCode, etc.)
set -g set-clipboard on
set -g allow-passthrough on

setw -g mode-keys vi
# set-option -g status-position top

# Navigation
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Vertical split in current pane's directory
bind '"' split-window -v -c "#{pane_current_path}"
# Horizontal split in current pane's directory
bind % split-window -h -c "#{pane_current_path}"
# New window in current pane's directory
bind c new-window    -c "#{pane_current_path}"

# PLUGINs
# git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'vimlinuz/tmux-sm'
set -g @session_manager_key 'S'

# THEME - minimal-tmux-status
set -g @plugin 'niksingh710/minimal-tmux-status'

# Theme configuration aligned to opencode's kanagawa-transparent palette
set -g @minimal-tmux-justify "centre"
set -g @minimal-tmux-indicator-str "JP"
set -g @minimal-tmux-indicator true
set -g @minimal-tmux-status "bottom"
set -g @minimal-tmux-bg "#2D4F67"
set -g @minimal-tmux-fg "#DCD7BA"

# Enable left and right status bar
set -g @minimal-tmux-right true
set -g @minimal-tmux-left true

# Use rounded indicators (Powerline symbols - requires Nerd Font)
set -g @minimal-tmux-use-arrow true
set -g @minimal-tmux-right-arrow ""
set -g @minimal-tmux-left-arrow ""

# Kanagawa-ish pane and message colors — transparent backgrounds
set -g status-style "bg=default,fg=#DCD7BA"
set -g message-style "bg=default,fg=#DCD7BA"
set -g message-command-style "bg=default,fg=#C8C093"
set -g pane-border-style "fg=#2A2A37"
set -g pane-active-border-style "fg=#7E9CD8"
set -g mode-style "bg=#2D4F67,fg=#DCD7BA"
set -g window-style "bg=default"
set -g window-active-style "bg=default"

run '~/.tmux/plugins/tpm/tpm'


