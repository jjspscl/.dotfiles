unbind r
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

set -g default-terminal "screen-256color"
set -as terminal-features ",xterm-256color:RGB"

# Rebind prefix to match JP's Omarchy/Leighton muscle memory.
set -g prefix C-s
unbind C-b
bind C-s send-prefix

# Window navigation can be repeated without re-pressing prefix.
bind -r n next-window
bind -r p previous-window

# Mouse + vi mode.
set -g mouse on
setw -g mode-keys vi

# Clipboard/OSC52 passthrough for TUI apps such as OpenCode.
set -g set-clipboard on
set -g allow-passthrough on

# Pane navigation.
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Split/new panes in the current pane's directory.
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Plugins.
# Install TPM with: git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'vimlinuz/tmux-sm'
set -g @session_manager_key 'S'

# Kanagawa/minimal status aligned with Leighton/OpenCode.
set -g @plugin 'niksingh710/minimal-tmux-status'
set -g @minimal-tmux-justify "centre"
set -g @minimal-tmux-indicator-str "JP"
set -g @minimal-tmux-indicator true
set -g @minimal-tmux-status "bottom"
set -g @minimal-tmux-bg "#2D4F67"
set -g @minimal-tmux-fg "#DCD7BA"
set -g @minimal-tmux-right true
set -g @minimal-tmux-left true
set -g @minimal-tmux-use-arrow true
set -g @minimal-tmux-right-arrow ""
set -g @minimal-tmux-left-arrow ""

# Kanagawa-ish pane/message colors with transparent terminal backgrounds.
set -g status-style "bg=default,fg=#DCD7BA"
set -g message-style "bg=default,fg=#DCD7BA"
set -g message-command-style "bg=default,fg=#C8C093"
set -g pane-border-style "fg=#2A2A37"
set -g pane-active-border-style "fg=#7E9CD8"
set -g mode-style "bg=#2D4F67,fg=#DCD7BA"
set -g window-style "bg=default"
set -g window-active-style "bg=default"

if-shell '[ -x ~/.tmux/plugins/tpm/tpm ]' 'run ~/.tmux/plugins/tpm/tpm'
